name: End-to-end Tests
on:
  push:
    branches:
      - '**' # Only on branches, not on tags
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Node so runner image updates cannot change it silently
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'yarn'

      - name: Build
        run: |
          node -v
          yarn install --frozen-lockfile
          yarn build:webcomponents

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
      - name: Attest
        uses: actions/attest-sbom@v3
        with:
          subject-path: '${{ github.workspace }}/dist/khiops-webcomponent/khiops-webcomponents.bundle.js'
          sbom-path: 'sbom.spdx.json'

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Bind explicitly to IPv4 so the dev server and wait-on agree
          start: yarn start --host 127.0.0.1 --port 4200
          # Plain http URL on 127.0.0.1 (no http-get:// scheme)
          wait-on: 'http://127.0.0.1:4200'
          wait-on-timeout: 180

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
