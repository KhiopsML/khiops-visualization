<div
  id="tree-hyper-selection-comp"
  [class.dark]="isDarkTheme"
  [class.embedded]="embedded"
>
  @if (selectedNode) {
    <div class="selection-title font-code">
      {{ 'GLOBAL.HYPER_TREE_SELECTION' | translate }}
    </div>
    <app-tree-node-details
      [selectedNode]="selectedNode"
      [treeRoot]="treeRoot"
      [minLeafTotalFreqs]="minLeafTotalFreqs"
      [maxLeafTotalFreqs]="maxLeafTotalFreqs"
      [theme]="theme"
      (lineageNodeSelected)="lineageNodeSelected.emit($event)"
    ></app-tree-node-details>
  }
  @if (!selectedNode) {
    @if (!isDarkTheme) {
      <div class="selection-title">
        {{ 'GLOBAL.HYPER_TREE_SELECTION' | translate }}
      </div>
    }
    <div class="selection-empty">
      {{ 'GLOBAL.NO_SELECTED_NODE' | translate }}
    </div>
  }
</div>
