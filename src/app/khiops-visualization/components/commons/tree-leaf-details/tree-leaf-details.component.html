<div id="tree-leaf-details-comp" fxFlexFill fxLayout="column">
  @if (!selectedNode?.isLeaf) {
    <kl-no-data fxFlexFill fxLayoutAlign="center center"> </kl-no-data>
  }
  <as-split direction="horizontal" fxFlex>
    <as-split-area [size]="35" fxLayout="column" class="kl-card">
      <app-target-distribution-graph
        fxFlex
        [enableSelection]="false"
        [maxBarThickness]="40"
        #targetDistributionGraph
        class="target-distribution-graph"
        [showFullscreenBtn]="true"
        titleTooltip="{{
          'TOOLTIPS.PREPARATION.TARGET_DISTRIBUTION.TITLE' | translate
        }}"
        [position]="position"
        id="{{ 'target-distribution-graph' + position }}"
        [attr.id]="'target-distribution-graph' + position"
        [displayedValues]="displayedValues"
        [inputDatas]="
          $safeNavigationMigration(
            distributionDatas?.treeNodeTargetDistributionGraphDatas
          )
        "
        [variableType]="
          $safeNavigationMigration(treePreparationDatas?.selectedVariable?.type)
        "
        (graphTypeChanged)="
          onTreeNodeTargetDistributionGraphTypeChanged($event)
        "
        (targetDistributionGraphDisplayedValuesChanged)="
          onTreeNodeTargetDistributionGraphDisplayedValuesChanged($event)
        "
      >
      </app-target-distribution-graph>
    </as-split-area>
    <as-split-area [size]="35" fxLayout="column" class="kl-card">
      @if (treeLeafRules && treeLeafRules.values) {
        <kl-ag-grid
          id="tree-leaf-rules-comp"
          [smallHeader]="true"
          [enableClickSelection]="false"
          class="variables-list"
          fxFlexFill
          [showSearch]="false"
          [displayCount]="false"
          [showLineSelection]="true"
          [title]="treeLeafRules.title"
          [showColumnsSelection]="true"
          [selectedVariable]="selectedNode$ | async"
          [inputDatas]="treeLeafRules.values"
          [displayedColumns]="treeLeafRules.displayedColumns"
        >
        </kl-ag-grid>
      }
    </as-split-area>
    <as-split-area [size]="30" fxLayout="column" class="kl-card">
      <app-tree-hyper-selection
        [selectedNode]="selectedNode$ | async"
        [treeRoot]="treePreparationDatas?.dimensionTree?.[0]"
        [minLeafTotalFreqs]="treePreparationDatas?.minFrequencies"
        [maxLeafTotalFreqs]="treePreparationDatas?.maxFrequencies"
        (lineageNodeSelected)="onLineageNodeSelected($event)"
      ></app-tree-hyper-selection>
    </as-split-area>
  </as-split>
</div>
