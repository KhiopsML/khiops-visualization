@if (shouldShow) {
  <div
    [ngStyle]="{
      'left.px': this.computeXPos(),
      'top.px': this.computeYPos(),
    }"
    class="tooltip"
    [class.visible]="display"
  >
    @if (title) {
      <p class="title" [innerHTML]="title"></p>
    }
    @if (body) {
      <div class="body-item">
        <span
          class="body-item-marker"
          [style.background]="markerColor"
        ></span>
        <p [innerHTML]="body"></p>
      </div>
    }
  </div>
}
