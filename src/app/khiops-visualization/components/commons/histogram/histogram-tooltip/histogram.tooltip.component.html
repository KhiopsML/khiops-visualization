@if (shouldShow) {
  <div
    [ngStyle]="{
      'left.px': this.computeXPos(),
      'top.px': this.computeYPos(),
    }"
    class="tooltip"
    [class.visible]="display"
  >
    @if (title) {
      <p class="title" [innerHTML]="title"></p>
    }
    @if (body) {
      <p [innerHTML]="body"></p>
    }
  </div>
}
