@if (dimensionTree) {
  <div
    fxLayout="column"
    id="tree-hyper-comp"
    fxFlex
    [ngClass]="{ fullscreen: isFullscreen }"
    [appFullscreenAnimation]="isFullscreen"
    #hyperTree
  >
    <div
      id="graph-header-comp"
      fxLayoutAlign="start center"
      class="scrollbar-thin screenshot-hide"
      fxLayout="column"
    >
      <div fxLayout="row" fxFlexFill fxLayoutAlign="start start">
        <h1 fxFlex fxLayoutAlign="start center">
          <svg lucideIcon="git-fork" size="18"></svg>
          {{ 'GLOBAL.HYPER_TREE' | translate }}
        </h1>
        @if (
          distributionDatas &&
          distributionDatas.targetDistributionDisplayedValues
        ) {
          <app-select-toggle-button
            [displayedValues]="
              distributionDatas.targetDistributionDisplayedValues
            "
            (selectToggleButtonChanged)="onSelectToggleButtonChanged($event)"
            [buttonTitle]="buttonTitle"
          >
          </app-select-toggle-button>
        }
        <kl-btn-fullscreen (toggleFullscreen)="onToggleFullscreen($event)">
        </kl-btn-fullscreen>
      </div>
    </div>
    <div
      fxLayout="row"
      fxLayoutAlign="start stretch"
      class="graph-header-tools header-panel-contrast"
    >
      <mat-checkbox
        fxFlex
        [checked]="visualization.purity"
        (change)="togglePurityVisualization($event.checked)"
      >
        {{ 'GLOBAL.DISPLAY_PURITY_BY_OPACITY' | translate }}
      </mat-checkbox>
      <mat-checkbox
        fxFlex
        [checked]="visualization.population"
        (change)="togglePopulationVisualization($event.checked)"
      >
        {{ 'GLOBAL.DISPLAY_LEAF_SIZES_BY_POPULATION' | translate }}
      </mat-checkbox>
    </div>
    <div
      fxLayoutAlign="start start"
      fxFlex
      fxLayout="column"
      class="tree-hyper-comp-container bg-dotted"
    >
      <div id="hyperTree"></div>
      <div class="tree-hyper-zoom-tools screenshot-hide">
        <kl-zoom-tools
          [emitGlobalEvents]="false"
          (zoomIn)="onClickOnZoomIn()"
          (zoomOut)="onClickOnZoomOut()"
          (zoomReset)="onClickOnResetZoom()"
        ></kl-zoom-tools>
      </div>
    </div>
  </div>
}
@if (!dimensionTree) {
  <kl-no-data fxFlex></kl-no-data>
}
