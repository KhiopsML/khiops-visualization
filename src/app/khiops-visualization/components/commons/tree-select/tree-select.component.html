@if (dimensionTree) {
  <div
    fxLayout="column"
    id="tree-select-comp"
    fxFlex
    [ngClass]="{ fullscreen: isFullscreen }"
    [appFullscreenAnimation]="isFullscreen"
  >
    <div
      id="graph-header-comp"
      fxLayout="row"
      fxLayoutAlign="start center"
      class="scrollbar-thin"
      [dblClickFullScreen]="isFullscreen"
      (toggleFullscreen)="onToggleFullscreen($event)"
    >
      <h1 fxLayoutAlign="start center" fxFlex>
        <svg lucideIcon="folder" size="16"></svg>
        <span fxFlex>{{ 'GLOBAL.DECISION_TREE' | translate }}</span>
      </h1>
      <mat-slide-toggle
        class="screenshot-hide"
        [checked]="focusSelection"
        (change)="onToggleFocusSelection($event.checked)"
      >
        {{ 'GLOBAL.FOCUS_SELECTION' | translate }}
      </mat-slide-toggle>
      <kl-btn-fullscreen
        [isFullscreen]="isFullscreen"
        class="screenshot-hide"
        (toggleFullscreen)="onToggleFullscreen($event)"
      >
      </kl-btn-fullscreen>
    </div>
    <div id="tree-select-comp-content" fxFlex>
      <div id="{{ 'tree_0' }}"></div>
    </div>
  </div>
}
@if (!dimensionTree) {
  <kl-no-data fxFlex></kl-no-data>
}
