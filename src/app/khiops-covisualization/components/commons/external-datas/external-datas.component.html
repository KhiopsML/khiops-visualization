<div
  class="external-datas-comp"
  fxFlexFill
  fxLayoutAlign="start start"
  fxLayout="column"
>
  @if (externalDatasGridRows.length > 0) {
    <div class="external-datas-grid" fxFlex>
      <kl-ag-grid
        fxFlexFill
        [titleIcon]="'file-up'"
        [title]="
          'GLOBAL.EXTERNAL_DATA_OF'
            | translate: { value: currentExternalDatasTitle }
        "
        [showLineSelection]="false"
        [enableClickSelection]="false"
        [showColumnsSelection]="false"
        [showSearch]="false"
        [showFullscreenBtn]="false"
        [inputDatas]="externalDatasGridRows"
        [displayedColumns]="externalDatasDisplayedColumns"
      >
        @if (currentMappingSource) {
          <button
            slot="header-tools"
            class="lucid-icon-button ext-datas-mapping-button"
            mat-stroked-button
            [matTooltip]="'GLOBAL.EDIT_MAPPING' | translate"
            (click)="editMapping(currentMappingSource)"
          >
            <svg lucideIcon="notebook-pen"></svg>
          </button>
        }
      </kl-ag-grid>
    </div>
  }
  @if (currentExternalDatas.length === 0) {
    <kl-no-data fxFlexFill [message]="getNoDatasMessage()"></kl-no-data>
  }
</div>
