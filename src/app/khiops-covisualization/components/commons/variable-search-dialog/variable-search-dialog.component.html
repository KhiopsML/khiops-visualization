<div id="variable-search-dialog-comp" fxFlexFill fxLayout="column">
  <div
    id="variable-search-dialog-content"
    fxLayout="column"
    fxFlex
    fxLayoutAlign="start stretch"
  >
    <div fxLayout="column" fxLayoutGap="10px" class="search-controls">
      <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
        <span class="label">{{ 'GLOBAL.INNER_VARIABLE' | translate }}:</span>
        <div fxFlex>
          <button
            class="button-accent inner-variable-select"
            title="{{ 'TOOLTIPS.VARIABLE.INNER.SELECT' | translate }}"
            mat-stroked-button
            color="accent"
            [matMenuTriggerFor]="selectInnerVariable"
          >
            <span>
              {{
                selectedInnerVariable() || 'GLOBAL.SELECT_VARIABLE' | translate
              }}
            </span>
            <em class="screenshot-hide">
              <mat-icon>keyboard_arrow_down</mat-icon>
            </em>
          </button>
          <mat-menu
            #selectInnerVariable
            class="inner-variable-menu-panel"
            (closed)="onInnerVariableMenuClosed()"
          >
            <div
              class="inner-variable-search"
              (click)="$event.stopPropagation()"
            >
              <input
                matInput
                type="text"
                class="inner-variable-search-input"
                [placeholder]="'GLOBAL.SEARCH' | translate"
                [ngModel]="innerVariableFilterText()"
                (ngModelChange)="onInnerVariableFilterTextChange($event)"
                (click)="$event.stopPropagation()"
                (keydown)="$event.stopPropagation()"
              />
              @if (innerVariableFilterText()) {
                <mat-icon
                  class="inner-variable-search-clear"
                  (click)="
                    $event.stopPropagation(); clearInnerVariableFilterText()
                  "
                  >close</mat-icon
                >
              }
            </div>
            @if (isInnerVariablesTruncated()) {
              <button mat-menu-item disabled class="truncated-hint">
                {{
                  'GLOBAL.TRUNCATED_DATAS'
                    | translate
                      : {
                          count: displayedInnerVariables().length,
                          total: filteredInnerVariables().length,
                        }
                }}
              </button>
            }
            @for (variable of displayedInnerVariables(); track variable) {
              <button
                mat-menu-item
                [class.selected-item]="variable === selectedInnerVariable()"
                (click)="onInnerVariableSelected(variable)"
              >
                {{ variable }}
              </button>
            }
          </mat-menu>
        </div>
        <div class="comp-header-tools screenshot-hide" fxLayout="row">
          <kl-header-tools [showMenu]="false"></kl-header-tools>
        </div>
        <button
          class="close-btn stroked-icon-button"
          mat-stroked-button
          matTooltip="{{ 'GLOBAL.CLOSE' | translate }}"
          (click)="onClickOnClose()"
        >
          <mat-icon fxFlexFill fxLayoutAlign="center center">close</mat-icon>
        </button>
      </div>
    </div>

    <div
      id="variable-search-results-table"
      fxLayout="column"
      class="kl-card"
      fxLayoutAlign="start center"
    >
      @if (isLoading()) {
        <div
          class="loading-results"
          fxLayout="column"
          fxFlexFill
          fxLayoutAlign="center center"
        >
          <mat-spinner
            diameter="40"
            color="accent"
            mode="indeterminate"
          ></mat-spinner>
        </div>
      } @else {
        <kl-ag-grid
          fxFlexFill
          [showFullSearch]="true"
          [showSearch]="true"
          [showLineSelection]="true"
          [showColumnsSelection]="false"
          [inputDatas]="$safeNavigationMigration(searchResults().values)"
          [title]="''"
          [displayedColumns]="
            $safeNavigationMigration(searchResults().displayedColumns)
          "
          (selectListItem)="onSelectRowChanged($event)"
        >
        </kl-ag-grid>
      }
    </div>
  </div>
</div>
