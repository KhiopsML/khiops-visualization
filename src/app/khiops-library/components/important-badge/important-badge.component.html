<span
  class="important-badge font-code"
  [class.important-badge-plain]="!color()"
  [class.important-badge-green]="color() === 'green'"
  [class.important-badge-orange]="color() === 'orange'"
  [class.important-badge-blue]="color() === 'blue'"
>
  {{ text() }}
</span>
