<div
  id="header-tools-comp"
  fxFlexFill
  fxLayout="row"
  fxLayoutAlign="center center"
>
  @if (showMenu) {
    <button
      class="lucid-icon-button"
      mat-stroked-button
      (click)="toggleSideBar()"
      attr.aria-label="{{ 'ARIA.HEADER.DISPLAY_SETTINGS' | translate }}"
      matTooltip="{{ 'GLOBAL.SETTINGS' | translate }}"
    >
      <svg lucideIcon="settings"></svg>
    </button>
  }
  <button
    id="header-tools-copy-datas-button"
    class="lucid-icon-button"
    mat-stroked-button
    matTooltip="{{
      'GLOBAL.COPY_DATAS' | translate: { shortcut: copyDatasShortcut }
    }}"
    (click)="copyDatas()"
    attr.aria-label="{{
      'GLOBAL.COPY_DATAS' | translate: { shortcut: copyDatasShortcut }
    }}"
  >
    <svg lucideIcon="copy"></svg>
  </button>
  <button
    id="header-tools-copy-image-button"
    class="lucid-icon-button"
    mat-stroked-button
    matTooltip="{{
      'GLOBAL.COPY_IMAGE' | translate: { shortcut: copyImageShortcut }
    }}"
    fxLayoutAlign="center center"
    (click)="copyImage()"
    attr.aria-label="{{
      'GLOBAL.COPY_IMAGE' | translate: { shortcut: copyImageShortcut }
    }}"
  >
    @if (!(copyImageService.isCopyingImage$ | async)) {
      <svg lucideIcon="images"></svg>
    }
    @if (copyImageService.isCopyingImage$ | async) {
      <svg
        class="loader-circle-icon"
        lucideIcon="loader-circle"
        aria-hidden="true"
      ></svg>
    }
  </button>
</div>
