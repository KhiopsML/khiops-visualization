<div
  #dialogWrapper
  class="kl-dialog-wrapper"
  [style.top.px]="sidePanelBounds?.top"
  [style.left.px]="sidePanelBounds?.left"
  [style.width.px]="sidePanelBounds?.width"
  [style.height.px]="sidePanelBounds?.height"
  [class.active]="
    (dialogContent$ | async)?.type !== 'none' &&
    !(dialogContent$ | async)?.config?.noOverlay
  "
  [class.no-overlay]="(dialogContent$ | async)?.config?.noOverlay"
  fxLayout="row"
  fxLayoutAlign="center center"
  [hidden]="dialogContent.config?.hidden || (sidePanelHidden$ | async)"
  *ngIf="dialogContent$ | async as dialogContent"
>
  <div
    class="dialog-overlay"
    fxFlexFill
    (click)="onBackdropClick()"
    *ngIf="dialogContent.type !== 'none' && !dialogContent.config?.noOverlay"
  ></div>
  <div
    class="dialog-content"
    fxLayout="column"
    *ngIf="dialogContent.type !== 'none'"
    [class.side-panel]="dialogContent.config?.sidePanel"
    [class.side-panel-drag-over]="
      dialogContent.config?.sidePanel && isSidePanelDragOver
    "
    [style.width]="dialogContent.config?.width"
    [style.height]="dialogContent.config?.height"
    [style.max-width]="dialogContent.config?.maxWidth"
    [style.max-height]="dialogContent.config?.maxHeight"
    [class]="dialogContent.config?.panelClass"
    (dragenter)="onSidePanelDragEnter($event, dialogContent.config?.sidePanel)"
    (dragover)="onSidePanelDragOver($event, dialogContent.config?.sidePanel)"
    (dragleave)="onSidePanelDragLeave($event, dialogContent.config?.sidePanel)"
    (drop)="onSidePanelDrop($event, dialogContent.config?.sidePanel)"
  >
    <!-- Dynamic Component Container -->
    <div
      class="dialog-body"
      fxFlex
      *ngIf="dialogContent.componentType"
      [attr.aria-busy]="isContentLoading"
    >
      <div
        *ngIf="isContentLoading"
        class="dialog-loading"
        role="progressbar"
        [attr.aria-label]="'GLOBAL.TREE_ANALYSIS' | translate"
      ></div>
      <ng-container #dynamicComponentContainer></ng-container>
    </div>
  </div>
</div>
