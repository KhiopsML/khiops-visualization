<form
  matRipple
  fxLayoutAlign="start center"
  class="search-input-btn"
  [class.full-search]="fullSearch"
  (submit)="$event.preventDefault()"
>
  @if (!visible) {
    <button
      type="button"
      class="lucid-icon-button"
      mat-stroked-button
      attr.aria-label="{{ 'ARIA.AG_GRID.OPEN_SEARCH_INPUT' | translate }}"
      matTooltip="{{ 'ARIA.AG_GRID.OPEN_SEARCH_INPUT' | translate }}"
      matTooltipPosition="above"
      (click)="open()"
    >
      <svg lucideIcon="search" [size]="16"></svg>
    </button>
  } @else {
    <button
      type="button"
      class="lucid-icon-button"
      mat-icon-button
      disabled
      attr.aria-label="{{ 'ARIA.AG_GRID.OPEN_SEARCH_INPUT' | translate }}"
    >
      <svg lucideIcon="search" [size]="16"></svg>
    </button>
    <input
      #searchInputEl
      name="searchInput"
      placeholder="{{ 'GLOBAL.SEARCH' | translate }}"
      [ngModel]="search"
      (ngModelChange)="updateSearch($event)"
      autocomplete="off"
    />
    <button
      type="button"
      attr.aria-label="{{ 'ARIA.AG_GRID.CLOSE_SEARCH_INPUT' | translate }}"
      mat-icon-button
      class="lucid-icon-button"
      color="primary"
      (click)="close()"
    >
      <mat-icon fxFlexFill fxLayoutAlign="center center">close</mat-icon>
    </button>
  }
</form>
