<svg
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.viewBox]="viewBox()"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Gradient definition: light orange to #ff6600 -->
  <defs>
    <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb380" />
      <stop offset="100%" stop-color="#ff6600" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle
    [attr.r]="radius()"
    [attr.cx]="center()"
    [attr.cy]="center()"
    fill="transparent"
    stroke="#eee"
    [attr.stroke-width]="backgroundStrokeWidth()"
  ></circle>

  <!-- Progress circle -->
  <circle
    [attr.r]="radius()"
    [attr.cx]="center()"
    [attr.cy]="center()"
    stroke="url(#progress-gradient)"
    [attr.stroke-width]="progressStrokeWidth()"
    stroke-linecap="round"
    [attr.stroke-dashoffset]="strokeDashOffset()"
    fill="transparent"
    [attr.stroke-dasharray]="strokeDashArray()"
    [attr.transform]="circleTransform()"
  ></circle>

  <!-- Percentage text -->
  <text
    [attr.x]="center()"
    [attr.y]="center()"
    fill="#ff6600"
    [attr.font-size]="fontSize + 'px'"
    font-weight="bold"
    text-anchor="middle"
    dominant-baseline="central"
  >
    {{ percentageValue() }}
    <tspan [attr.font-size]="fontSize * 0.7 + 'px'">%</tspan>
  </text>
</svg>
