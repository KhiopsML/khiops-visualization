<div class="level-header" (click)="onHeaderClick($event)">
  <span class="level-header-title" [title]="headerName">{{ headerName }}</span>

  <span class="level-header-sort" aria-hidden="true">
    <span
      *ngIf="sortDirection === 'asc'"
      class="ag-icon ag-icon-asc"
      unselectable="on"
    ></span>
    <span
      *ngIf="sortDirection === 'desc'"
      class="ag-icon ag-icon-desc"
      unselectable="on"
    ></span>
  </span>

  <button
    type="button"
    class="level-header-settings-btn"
    [attr.aria-label]="'ARIA.AG_GRID.TOGGLE_LEVEL_DISPLAY_MODE' | translate"
    [matMenuTriggerFor]="displayModeMenu"
    (click)="$event.stopPropagation()"
  >
    <svg lucideIcon="settings" size="12"></svg>
  </button>
</div>

<mat-menu #displayModeMenu="matMenu">
  <button
    mat-menu-item
    [class.selected-item]="isRelativeValue"
    (click)="onSelectLevelDisplayMode(true, $event)"
  >
    {{ 'GLOBAL.LEVEL_DISPLAY_MODE_RELATIVE' | translate }}
  </button>
  <button
    mat-menu-item
    [class.selected-item]="!isRelativeValue"
    (click)="onSelectLevelDisplayMode(false, $event)"
  >
    {{ 'GLOBAL.LEVEL_DISPLAY_MODE_ABSOLUTE' | translate }}
  </button>
</mat-menu>
