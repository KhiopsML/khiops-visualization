<div class="level-cell">
  <mat-progress-bar
    class="level-progress"
    mode="determinate"
    [value]="progressValue"
    [attr.aria-label]="'Level ' + params.value"
  ></mat-progress-bar>
  <span class="level-value">{{ formattedLevel }}</span>
</div>
